name: FinRisk-Engine CI/CD Quality Gate Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automated-tests:
    name: 🧪 Automated Risk Engine & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run SDET Test Suite (Engine & API Quality Gate)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  docker-container-validation:
    name: 🐳 Docker Multi-Container Build Validation
    runs-on: ubuntu-latest
    needs: automated-tests

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: finrisk-api:latest

      - name: 🏗️ Build Streamlit Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: finrisk-dashboard:latest

      - name: 🩺 Validate Docker Compose Architecture
        run: docker compose config
